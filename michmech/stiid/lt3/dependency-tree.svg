<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Dependency tree for My older brother is very talented.</title>
  <desc id="desc">The root is is. Its dependents are brother (nsubj), talented (acomp), and the full stop (punct). Brother has dependents My (poss) and older (amod). Talented has dependent very (advmod).</desc>
